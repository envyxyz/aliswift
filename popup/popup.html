<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AliSwift</title>
    <link rel="stylesheet" href="../lib/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        AliSwift
      </h1>
      <div class="head-tools">
        <button id="dashBtn" class="icon-btn" type="button" aria-label="Dashboard" title="Dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" />
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94c0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.48-.1-.62l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
            />
          </svg>
        </button>
        <div class="profile" id="profile"></div>
      </div>
    </header>

    <main>
      <p id="notice" class="muted" hidden></p>

      <form id="form" hidden>
        <div>
          <label for="sheet">Save to</label>
          <select id="sheet"></select>
          <input id="dest" value="Your library on this device" readonly hidden aria-describedby="lockNote" />
          <p id="lockNote" class="lock" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" /></svg><button id="lockAct" type="button" class="link-btn"></button> to save to Google Sheets.
          </p>
        </div>
        <div>
          <label for="title">Keywords</label>
          <input id="title" type="text" required autocomplete="off" />
        </div>
        <div>
          <div class="row">
            <div>
              <label for="price">Cost price <span id="priceCur" class="muted"></span></label>
              <input id="price" type="text" inputmode="decimal" placeholder="0.00" required autocomplete="off" />
            </div>
            <div>
              <label for="salePrice">Sell price <span id="saleCur" class="muted"></span></label>
              <input id="salePrice" type="text" inputmode="decimal" placeholder="Optional" autocomplete="off" />
            </div>
          </div>
          <div id="currency" role="status">
            <div id="fxWarn" class="notice" data-tone="warn" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" /></svg>
              <div><p><span id="fxWarnText"></span> <a id="fxSettings" href="../options/options.html#sheets" hidden>Set marketplace</a></p></div>
            </div>
            <p id="fxNote" class="note" hidden></p>
          </div>
        </div>
        <div>
          <label for="link">Link</label>
          <input id="link" type="text" readonly />
        </div>
        <button id="addBtn" class="btn" type="submit">Add to Sheet</button>
        <p id="status" role="status"></p>
      </form>
    </main>

    <script src="../lib/shared.js"></script>
    <script src="../lib/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
