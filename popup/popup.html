<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AliSwift</title>
    <link rel="stylesheet" href="../lib/ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        AliSwift
      </h1>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M19.14 12.94c.04-.3.06-.61.06-.94c0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.48-.1-.62l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
          />
        </svg>
      </button>
    </header>

    <main>
      <section id="setup" hidden>
        <p>Add a Google Sheet to start saving products.</p>
        <button id="setupBtn" class="btn" type="button">Open settings</button>
      </section>

      <p id="notice" class="muted" hidden></p>

      <form id="form" hidden>
        <div>
          <label for="sheet">Sheet</label>
          <select id="sheet"></select>
        </div>
        <div>
          <label for="title">Keywords</label>
          <input id="title" type="text" required autocomplete="off" />
        </div>
        <div class="row">
          <div>
            <label for="price">Cost price</label>
            <input id="price" type="text" inputmode="decimal" placeholder="0.00" required autocomplete="off" />
          </div>
          <div>
            <label for="salePrice">Sell price <span class="muted">(optional)</span></label>
            <input id="salePrice" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" />
          </div>
        </div>
        <div>
          <label for="link">Link</label>
          <input id="link" type="text" readonly />
        </div>
        <button id="addBtn" class="btn" type="submit">Add to Sheet</button>
        <p id="status" role="status"></p>
      </form>
    </main>

    <script src="../lib/shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
